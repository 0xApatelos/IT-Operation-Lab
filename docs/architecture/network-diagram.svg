<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#35659C"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B03A3A"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#FFFFFF; stroke:#35659C; stroke-width:1.5; rx:8; }
    .zone  { fill:#F5F8FC; stroke:#35659C; stroke-width:1.5; stroke-dasharray:6 4; }
    .green { fill:#E4F4EA; stroke:#2F7D4F; stroke-width:1.5; }
    .red   { fill:#FDECEC; stroke:#B03A3A; stroke-width:1.5; stroke-dasharray:5 4; }
    .title { font-size:19px; font-weight:700; fill:#1F2A3A; }
    .sub   { font-size:12px; fill:#5A6B80; }
    .h     { font-size:13.5px; font-weight:700; fill:#1F2A3A; }
    .t     { font-size:12px; fill:#33465E; }
    .lbl   { font-size:11.5px; fill:#35659C; }
    .lblR  { font-size:11.5px; fill:#B03A3A; }
    .line  { stroke:#35659C; stroke-width:1.6; fill:none; }
    .lineR { stroke:#B03A3A; stroke-width:1.6; fill:none; stroke-dasharray:6 4; }
  </style>

  <rect x="0" y="0" width="980" height="600" fill="#FFFFFF"/>
  <text x="24" y="34" class="title">Diagram Jaringan Lab — IT Support Homelab (Fase 1)</text>
  <text x="24" y="56" class="sub">Semua alamat IP adalah CONTOH — verifikasi aktual: ipconfig (Windows, adapter VMnet1) dan ip -br a (VM)</text>

  <!-- Windows host -->
  <rect x="20" y="72" width="940" height="210" rx="10" fill="#EAF2FB" stroke="#35659C" stroke-width="1.5"/>
  <text x="36" y="98" class="h">Windows host 10/11 — VMware Workstation Pro (hypervisor)</text>

  <!-- admin box -->
  <rect x="40" y="116" width="250" height="90" rx="8" class="green"/>
  <text x="54" y="140" class="h">Pengelola lab</text>
  <text x="54" y="160" class="t">browser · PowerShell · ssh</text>
  <text x="54" y="178" class="t">Test-NetConnection 192.168.200.10</text>
  <text x="54" y="196" class="sub">(IP CONTOH)</text>

  <!-- VMnet1 -->
  <rect x="330" y="116" width="300" height="90" rx="8" class="box" fill="#FFFFFF"/>
  <text x="344" y="140" class="h">VMnet1 — host-only</text>
  <text x="344" y="160" class="t">subnet CONTOH: 192.168.200.0/24</text>
  <text x="344" y="178" class="t">host adapter CONTOH: 192.168.200.1</text>
  <text x="344" y="196" class="sub">lab-only, tanpa rute internet</text>

  <!-- VMnet8 -->
  <rect x="670" y="116" width="270" height="90" rx="8" class="red"/>
  <text x="684" y="140" class="h">VMnet8 — NAT</text>
  <text x="684" y="160" class="t">arah keluar saja (apt update, DNS)</text>
  <text x="684" y="178" class="t">tanpa port-forwarding inbound</text>
  <text x="684" y="196" class="sub">gateway ke internet</text>

  <!-- VM zone -->
  <rect x="150" y="360" width="520" height="185" rx="10" class="zone"/>
  <text x="166" y="386" class="h">VM Ubuntu Server 24.04 LTS</text>
  <text x="166" y="404" class="sub">IP CONTOH: 192.168.200.10/24 (statik via netplan) · 2 vCPU · 2 GB RAM · 25 GB disk</text>

  <!-- service box -->
  <rect x="175" y="420" width="300" height="92" rx="8" class="green"/>
  <text x="189" y="444" class="h">demo-http.service (systemd)</text>
  <text x="189" y="464" class="t">python3 demo_http_server.py</text>
  <text x="189" y="482" class="t">listen 0.0.0.0:8080 · user sistem demo-http</text>
  <text x="189" y="500" class="t">GET /health → 200 JSON</text>

  <!-- ssh box -->
  <rect x="495" y="420" width="155" height="92" rx="8" class="box"/>
  <text x="507" y="444" class="h">openssh-server</text>
  <text x="507" y="464" class="t">port :22</text>
  <text x="507" y="482" class="t">opsional, lab-only</text>
  <text x="507" y="500" class="sub">untuk scp/repo transfer</text>

  <!-- arrows host row -->
  <path d="M290 161 L325 161" class="line" marker-end="url(#arrow)"/>
  <text x="296" y="152" class="lbl">HTTP·SSH</text>

  <!-- admin -> VM -->
  <path d="M165 206 L165 330 L230 360" class="line" marker-end="url(#arrow)"/>
  <text x="24" y="300" class="lbl">trafik lab host-only</text>
  <text x="24" y="316" class="lbl">HTTP :8080 · SSH :22</text>

  <!-- VMnet1 -> VM -->
  <path d="M480 206 L480 355" class="line" marker-end="url(#arrow)"/>
  <text x="486" y="285" class="lbl">jembatan host ↔ VM</text>

  <!-- VM -> VMnet8 -> Internet -->
  <path d="M670 430 L790 430 L805 340 L805 212" class="lineR" marker-end="url(#arrowRed)"/>
  <text x="700" y="452" class="lblR">keluar saja via NAT (apt update · DNS)</text>

  <!-- Internet cloud -->
  <ellipse cx="805" cy="160" rx="75" ry="34" class="red" fill="#FDECEC"/>
  <text x="805" y="166" text-anchor="middle" class="h">Internet</text>

  <!-- legend -->
  <rect x="24" y="528" width="932" height="48" rx="8" fill="#F7F7F5" stroke="#C9C9C4"/>
  <line x1="44" y1="546" x2="84" y2="546" class="line" marker-end="url(#arrow)"/>
  <text x="92" y="550" class="t">trafik lab (host-only, dianggap terpercaya hanya untuk latihan)</text>
  <line x1="470" y1="546" x2="510" y2="546" class="lineR" marker-end="url(#arrowRed)"/>
  <text x="518" y="550" class="t">arah keluar via NAT — tanpa inbound dari internet</text>
  <text x="44" y="568" class="sub">Batas kepercayaan &amp; aturan keselamatan: docs/security/safety-rules.md · Tidak ada port yang diekspos ke internet</text>
</svg>
