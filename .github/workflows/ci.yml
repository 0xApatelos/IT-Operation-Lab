# CI: lint + unit test deterministik (tanpa VM, internet, secret, biaya).
# Integration test monitor (marker "integration") TIDAK dijalankan di CI —
# butuh lingkungan lab nyata; jalankan eksplisit secara lokal.
name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor + assistant (dengan dev dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e "monitor[dev]" -e "assistant[dev]"

      - name: Lint (ruff)
        run: |
          ruff check monitor/monitor_lab monitor/tests
          ruff check assistant/assistant_lab assistant/tests assistant/evaluation

      - name: Unit tests monitor (deterministik, tanpa internet/VM/secret)
        run: pytest monitor/tests -v

      - name: Unit tests assistant (deterministik, mini corpus)
        run: pytest assistant/tests -v

      - name: Evaluasi assistant (retrieval + perilaku aman, tanpa provider)
        run: python assistant/evaluation/evaluate.py
